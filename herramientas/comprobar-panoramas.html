<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comprobar panorámicas antes de subir</title><style>body{font:16px/1.5 system-ui,sans-serif;color:#21373a;background:#f6f4ef;max-width:900px;margin:30px auto;padding:0 20px}h1{font:normal 2rem Georgia,serif}input{display:block;margin:18px 0;padding:14px;border:1px dashed #818f8e;width:100%}table{border-collapse:collapse;width:100%;background:#fff}td,th{padding:8px 12px;text-align:left;border-bottom:1px solid #dde2dc}th{background:#e5ebe7}.bad{color:#9b2226;font-weight:700}.warn{color:#8b5a15;font-weight:700}p{max-width:65ch}small{display:block;color:#526261;margin-bottom:16px}@media(max-width:600px){td,th{padding:6px;font-size:.8rem}}</style><h1>Comprobar panorámicas</h1><p>Selecciona tus JPG o PNG del 00 al 14. Este análisis se hace en tu navegador: las imágenes no se envían a ningún servidor.</p><input id="files" type="file" accept=".jpg,.jpeg,.png,image/jpeg,image/png" multiple aria-label="Seleccionar panorámicas"><div id="results" role="status" aria-live="polite"></div><script>document.getElementById('files').addEventListener('change',function(e){var files=[].slice.call(e.target.files),box=document.getElementById('results');box.replaceChildren();if(!files.length)return;var mb=1024*1024;var total=files.reduce(function(n,f){return n+f.size},0);var summary=document.createElement('p');summary.textContent=files.length+' archivo(s) · '+(total/mb).toFixed(1)+' MiB en total';box.appendChild(summary);var names=files.map(function(f){return f.name.toLowerCase()});var missing=[];for(var n=0;n<=14;n++){var label=String(n).padStart(2,'0');if(!names.some(function(name){return name===label+'.jpg'||name===label+'.jpeg'||name===label+'.png'}))missing.push(label);}var note=document.createElement('small');note.textContent=missing.length?'Faltan estos nombres para completar las 15 vistas: '+missing.join(', '):'Nombres detectados del 00 al 14. Comprueba que las extensiones coinciden con datos/fichas.js.';box.appendChild(note);var table=document.createElement('table');var head=document.createElement('tr');['Archivo','Tamaño','Observación'].forEach(function(t){var th=document.createElement('th');th.textContent=t;head.appendChild(th)});table.appendChild(head);files.sort(function(a,b){return a.name.localeCompare(b.name)}).forEach(function(file){var row=document.createElement('tr');var status=file.size>25*mb?'Más de 25 MiB: GitHub no permite subirlo desde su interfaz web':file.size>10*mb?'Imagen grande: conviene optimizarla antes de subir':'Tamaño razonable';[file.name,(file.size/mb).toFixed(1)+' MiB',status].forEach(function(t,i){var cell=document.createElement('td');cell.textContent=t;if(i===2&&file.size>10*mb)cell.className=file.size>25*mb?'bad':'warn';row.appendChild(cell)});table.appendChild(row)});box.appendChild(table)});</script></html>
